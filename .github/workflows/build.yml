name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find Android ZIP
        run: |
          ZIP=$(find . -maxdepth 2 -name "*.zip" | head -1)
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          echo "Found ZIP: $ZIP"

      - name: Extract project ZIP
        run: |
          mkdir -p project
          unzip -o "$ZIP" -d project

      - name: Find Gradle Wrapper
        run: |
          GRADLEW=$(find project -name gradlew -type f | head -1)
          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found in ZIP"
            find project -maxdepth 3 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project found at: $PROJECT_DIR"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PartsMonitor-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
