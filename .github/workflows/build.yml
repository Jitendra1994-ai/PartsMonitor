name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Find Android project
        run: |
          echo "Finding Android project..."
          find . -name "settings.gradle*" -o -name "build.gradle*" | head -30

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build APK
        working-directory: PartsMonitor_Android_Source
        run: |
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PartsMonitor-APK
          path: PartsMonitor_Android_Source/app/build/outputs/apk/debug/*.apk
